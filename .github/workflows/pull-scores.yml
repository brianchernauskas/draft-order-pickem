name: Pull final scores

# Every 15 minutes across the Week 1 window, 3-7 September UTC. The Thursday
# opener kicks at 23:30 UTC on the 3rd and the Sunday nightcap finishes early on
# the 7th, so the window is expressed in UTC rather than local dates.
#
# It was hourly, which in practice it never was: GitHub treats schedules as
# best-effort and deferred this job by two to five hours all through Thursday,
# leaving the opener's final off the board for hours after it ended. A denser
# schedule does not make any single firing more reliable -- it just means the
# next chance is 15 minutes away instead of two hours.
#
# Most of these runs still cost nothing. The job reads Firestore first and only
# calls the Odds API when a game is past the elapsed gate and still missing a
# score, so every run outside a game's finishing window exits free -- which is
# why the cadence, not the window, is the only real cost lever. Budget is about
# 80 credits for the weekend against a 500/month free tier; halve it by moving
# to '*/30' if quota gets tight.
on:
  schedule:
    - cron: '*/15 * 3-7 9 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and print finals without writing them'
        type: boolean
        default: false
      force:
        description: 'Skip the elapsed-time gate and check every unrecorded game now (costs 2 credits)'
        type: boolean
        default: false

# Two runs writing the settings doc at once would race on read-modify-write.
concurrency:
  group: board-writes
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull scores
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          node tools/pull-scores.mjs \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}
